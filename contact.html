<head>
<meta charset="UTF-8">

<meta name="description" content="ส่งคำถามเกี่ยวกับสถานที่ท่องเที่ยวและกิจกรรมชุมชนในบุรีรัมย์ถึงทีมงาน กรอกแบบฟอร์มได้ที่นี่">
<meta property="og:title" content="ติดต่อเรา | ศูนย์รวมข้อมูลท่องเที่ยวชุมชนจังหวัดบุรีรัมย์">
<meta property="og:description" content="ส่งคำถามเกี่ยวกับสถานที่ท่องเที่ยวและกิจกรรมชุมชนในบุรีรัมย์ถึงทีมงาน">
<meta property="og:type" content="website">
<meta property="og:image" content="images/prasat-phanom-rung.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="index.html"><i class="fa-solid fa-mountain-sun" aria-hidden="true"></i> เที่ยวบุรีรัมย์</a>
    <button id="menuBtn" class="icon-btn menu-btn" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="mainNav"><i class="fa-solid fa-bars"></i></button>
    <nav id="mainNav" class="nav" aria-label="เมนูหลัก">
      <a href="index.html">หน้าแรก</a>
      <a href="places.html">สถานที่ท่องเที่ยว</a>
      <a href="contact.html" aria-current="page">ติดต่อเรา</a>
      <button id="themeBtn" class="icon-btn" aria-label="สลับโหมดสว่าง/มืด"><i class="fa-solid fa-circle-half-stroke"></i></button>
    </nav>
  </div>
</header>

<main class="wrap section narrow">
  <h1>ติดต่อเรา</h1>
  <p class="lead">ส่งคำถามหรือแนะนำสถานที่ใหม่ ทีมงานจะตอบกลับทางอีเมล</p>
  <form id="contactForm" novalidate>
    <div class="field"><label for="name">ชื่อ-นามสกุล</label><input id="name" name="name" type="text" autocomplete="name"><small class="err" id="nameErr"></small></div>
    <div class="field"><label for="email">อีเมล</label><input id="email" name="email" type="email" autocomplete="email"><small class="err" id="emailErr"></small></div>
    <div class="field"><label for="phone">เบอร์โทร (ไม่บังคับ)</label><input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="0812345678"><small class="err" id="phoneErr"></small></div>
    <div class="field"><label for="msg">ข้อความ</label><textarea id="msg" name="msg" rows="5"></textarea><small class="err" id="msgErr"></small></div>
    <button class="btn" type="submit">ส่งข้อความ</button>
    <p id="ok" class="ok" role="status" hidden>ส่งข้อความเรียบร้อย ขอบคุณที่ติดต่อเรา</p>
  </form>
</main>

<footer class="site-footer">
  <div class="wrap foot">

  </div>
</footer>
<script src="script.js"></script>
</body>
</html>
